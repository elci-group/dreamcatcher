# kaptaind configuration for the dreamcatcher workspace.

health_port = 3103

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 5

[weights]
s = 0.35
a = 0.30
d = 0.20
r = 0.15

[push]
enabled = true
branch = "master"

[angler.git_hooks]
enabled = false

[ratelimit]
min_commit_interval = 10

[test]
command = "deliver --spec deliver.toml --strict"
required = true

[staging]
mode = "cluster"
exclude = ["target/**", "deliverables/**", ".kaptaind/**", "*.log", ".env*"]

[commit]
require_bump = false
